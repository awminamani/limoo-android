org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Xray core AAR (2dust/AndroidLibXrayLite). Pin a release tag here for reproducible builds, e.g.
# .../releases/download/<tag>/libv2ray.aar
# PINNED. This used to be releases/latest, which is the root cause of the reported connect failure:
# the app is built against whatever core happened to be newest at build time, so an upstream change
# reached users silently, with no commit here to point at. `limoo.coreSha256` makes the AAR verifiable
# and `limoo.xrayVersion` is the version check-xray-configs.sh validates against - together they turn a
# core upgrade into a deliberate, tested change.
# To bump: change all three (tag + sha + xrayVersion) in one commit.
limoo.coreUrl=https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar
limoo.coreSha256=cf71680b776b9ca583747ba652f816b047a655eab875d8951e6141636d88bbd6
limoo.xrayVersion=v26.9.30
