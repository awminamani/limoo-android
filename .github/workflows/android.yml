name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # required to create GitHub Releases

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Preflight
        run: python3 tools/preflight.py

      # The keystore MUST be exported before ANY Gradle invocation. Gradle resolves signingConfigs at
      # configuration time, and this step used to sit AFTER `assemble release`, so
      # signingConfigs.findByName("release") was always null and every "release" APK silently fell back to
      # the auto-generated debug key. AGP mints a fresh debug key per runner, so each build produced a
      # DIFFERENT certificate and no update could ever install over the last one. Keep this above
      # `Fetch Xray core`: the first ./gradlew call is what reads the environment.
      - name: Release keystore
        env:
          KS_B64: ${{ secrets.LIMOO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LIMOO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIMOO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LIMOO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            { echo LIMOO_KEYSTORE=release.jks; echo LIMOO_KEYSTORE_PASSWORD=$KS_PASS; echo LIMOO_KEY_ALIAS=$KEY_ALIAS; echo LIMOO_KEY_PASSWORD=$KEY_PASS; } >> $GITHUB_ENV
            echo "release keystore staged from secrets"
          else
            echo '::warning::No LIMOO_KEYSTORE_B64 secret - the release APK will be signed with a throwaway debug key. Android will REFUSE to install it over the previous build (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and every build gets a different certificate. Run tools/make-keystore.sh once to fix this permanently.'
          fi

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch Xray core
        run: ./gradlew fetchXrayCore --no-daemon
        continue-on-error: true

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Fail the release if it is not signed with a real key. The step above already warns, but a warning
      # that shipped five broken releases is not a guard. apksigner prints the certificate the APK is
      # actually signed with, so this catches the silent debug-key fallback that the previous step order
      # caused, and catches a wrong LIMOO_KEY_ALIAS too.
      - name: Verify the release APK signature
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -i "Signer #1 certificate SHA-256 digest" || true)
          echo "$CERT"
          if echo "$CERT" | grep -qi "CN=Android Debug"; then
            echo "::error::The release APK is signed with the throwaway Android Debug key. Every build mints a new one, so no update can ever install over the last. Check that the 'Release keystore' step runs BEFORE the first ./gradlew command."
            exit 1
          fi
          echo "release APK is signed with a real key"

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: limoo-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      # ---- GitHub Release ----
      # Every successful master build publishes its APKs to the Releases page under the app's own
      # versionName, so the download list is a history of versions rather than one overwritten file.
      # The tag is the versionName; the versionCode is appended so an ordering mistake cannot silently
      # replace an existing tag.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
          VER_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          TAG="v${VER_NAME}"
          echo "Publishing $TAG (versionCode $VER_CODE)"

          # Rename to the version so the release page shows useful file names.
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/Limoo-${VER_NAME}-release.apk"
          done
          for f in app/build/outputs/apk/debug/*.apk; do
            [ -e "$f" ] || continue
            cp "$f" "dist/Limoo-${VER_NAME}-debug.apk"
          done

          NOTES=$(git log -1 --pretty=%B)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Existing release for this version: replace its assets and notes.
            gh release upload "$TAG" dist/*.apk --clobber
            gh release edit "$TAG" --notes "$NOTES"
            echo "Updated existing release $TAG"
          else
            gh release create "$TAG" dist/*.apk \
              --title "Limoo ${VER_NAME}" \
              --notes "$NOTES"
            echo "Created release $TAG"
          fi