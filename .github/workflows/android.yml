name: Android CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Preflight
        run: python3 tools/preflight.py
      
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch Xray core
        run: ./gradlew fetchXrayCore --no-daemon
        continue-on-error: true

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      
      - name: Release keystore (optional, from secrets)
        env:
          KS_B64: ${{ secrets.LIMOO_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.LIMOO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LIMOO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LIMOO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            { echo LIMOO_KEYSTORE=release.jks; echo LIMOO_KEYSTORE_PASSWORD=$KS_PASS; echo LIMOO_KEY_ALIAS=$KEY_ALIAS; echo LIMOO_KEY_PASSWORD=$KEY_PASS; } >> $GITHUB_ENV
          else echo '::warning::No LIMOO_KEYSTORE_B64 secret - the release APK is signed with a throwaway debug key. Android will REFUSE to install this over the previous build (INSTALL_FAILED_UPDATE_INCOMPATIBLE) and the user must uninstall first. Run tools/make-keystore.sh once to fix this permanently.'; fi
      
      - name: Assemble release
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: limoo-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
